name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A9DCC2: ${{ secrets.A9DCC2 }}
          B82A01: ${{ secrets.B82A01 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A9DCC2', '')
          k2 = os.environ.get('B82A01', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- a0cb47716f0cae50415baeae3d5ce51d045d -->', k1) if k1 else txt
          out = out.replace('<!-- 738ddfa8d47c01b432d50c -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
